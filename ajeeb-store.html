<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متجر العجيب | ajeeb_ee</title>
<style>
:root{--bg:#fffaf0;--card:#fff;--tx:#161616;--mu:#666;--br:#e8dfc8;--y:#FFC62D;--k:#111;--box-sizing:border-box;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0d;--card:#1a1a1a;--tx:#f5f5f5;--mu:#aaa;--br:#2e2e2e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0d0d;--card:#1a1a1a;--tx:#f5f5f5;--mu:#aaa;--br:#2e2e2e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;line-height:1.7}
header{background:var(--k);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;border-bottom:3px solid var(--y)}
.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.bar img{width:46px;height:46px;border-radius:50%}
.bar b{font-size:1.2rem;color:var(--y)}.bar small{display:block;color:#bbb;font-size:.75rem;line-height:1.2}
.sp{flex:1}
.cartbtn{background:var(--y);color:#111;border:0;border-radius:24px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
.hero{background:var(--k);color:#fff;text-align:center;padding:36px 16px 44px}
.hero h1{margin:0 0 8px;font-size:clamp(1.6rem,5vw,2.6rem)}.hero h1 span{color:var(--y)}
.hero p{margin:0 auto 18px;max-width:520px;color:#ccc}
.cta{display:inline-block;background:var(--y);color:#111;text-decoration:none;font-weight:700;padding:11px 26px;border-radius:28px}
.wrap{max-width:1100px;margin:auto;padding:24px 16px 80px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px}
.tabs button{flex:none;border:1px solid var(--br);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 16px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--y);color:#111;border-color:var(--y);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--br);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;font-size:5rem;border-bottom:1px solid var(--br)}
.ph.empty{background:linear-gradient(135deg,var(--y),#ffdf85)}
.ph img{width:100%;height:100%;object-fit:contain}
.in{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag{font-size:.75rem;color:var(--mu)}
.in h3{margin:0;font-size:1.1rem}.in p{margin:0;color:var(--mu);font-size:.92rem}
.in ul{margin:0;padding:0 18px 0 0;font-size:.88rem}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px}
.price{font-size:1.35rem;font-weight:800}.price small{font-size:.8rem;font-weight:400;color:var(--mu)}
.add{background:var(--k);color:var(--y);border:0;border-radius:22px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
footer{background:var(--k);color:#ccc;text-align:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
footer a{color:var(--y)}
#drawer{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:9}
#drawer.open{display:block}
.panel{position:absolute;left:0;top:0;bottom:0;width:min(400px,100%);background:var(--bg);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;overflow:auto}
.it{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--br);padding:8px 0}
.it span{flex:1}.it button{width:28px;height:28px;border-radius:50%;border:1px solid var(--br);background:var(--card);color:var(--tx);cursor:pointer}
.tot{font-weight:800;font-size:1.2rem;display:flex;justify-content:space-between}
.wa{background:#25D366;color:#fff;border:0;border-radius:24px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.opt{display:flex;flex-direction:column;gap:4px}.opt label{display:flex;gap:6px;align-items:center}input[type=radio]{padding:0;width:auto}
input{padding:10px;border:1px solid var(--br);border-radius:10px;background:var(--card);color:var(--tx);font:inherit}
</style></head><body>

const f=n=>n.toFixed(3)+' ر.ع';
function show(){const c=['الكل',...new Set(P.map(p=>p.cat))];
document.getElementById('tabs').innerHTML=c.map(x=>`<button class="${x===cat?'on':''}" onclick="cat='${x}';show()">${x}</button>`).join('');
document.getElementById('grid').innerHTML=P.filter(p=>cat==='الكل'||p.cat===cat).map(p=>`<div class="card"><div class="ph ${p.img?'':'empty'}">${p.img?`<img src="${p.img}" alt="${p.name}">`:p.emoji}</div><div class="in"><span class="tag">${p.cat}</span><h3>${p.name}</h3><p>${p.desc}</p><ul>${p.pts.map(t=>`<li>${t}</li>`).join('')}</ul><div class="row"><div class="price">${f(p.price)}</div><button class="add" onclick="add(${p.id})">أضف للسلة</button></div></div></div>`).join('')}
function add(i){cart[i]=(cart[i]||0)+1;draw();}
function ch(i,d){cart[i]=(cart[i]||0)+d;if(cart[i]<=0)delete cart[i];draw();}
const val=n=>document.querySelector('input[name='+n+']:checked').value;
function sub(){return Object.keys(cart).reduce((s,i)=>s+cart[i]*P.find(p=>p.id==i).price,0)}
function dv(){if(!Object.keys(cart).length||val('ar')!=='in')return 0;return val('dm')==='home'?2:1}
function tot(){return sub()+dv()}
function draw(){document.getElementById('cn').textContent=Object.values(cart).reduce((a,b)=>a+b,0);
document.getElementById('items').innerHTML=Object.keys(cart).map(i=>{const p=P.find(x=>x.id==i);return `<div class="it"><span>${p.name}<br><small>${f(p.price)}</small></span><button onclick="ch(${i},1)">+</button><b>${cart[i]}</b><button onclick="ch(${i},-1)">−</button></div>`}).join('')||'<p>السلة فارغة</p>';
document.getElementById('sum').textContent=f(tot());document.getElementById('qt').textContent=Object.values(cart).reduce((a,b)=>a+b,0);
document.getElementById('dl').textContent=val('ar')==='in'?'المنتجات: '+f(sub())+' + التوصيل: '+f(dv()):'تكلفة التوصيل لدول الخليج تحدد عند التواصل'}
function tg(o){document.getElementById('drawer').classList.toggle('open',!!o)}
function send(){if(!Object.keys(cart).length)return;
let m='طلب جديد من موقع متجر العجيب:\n'+Object.keys(cart).map(i=>{const p=P.find(x=>x.id==i);return `- ${p.name} × ${cart[i]} = ${f(p.price*cart[i])}`}).join('\n')+`\nالمجموع: ${f(tot())}`;
const n=document.getElementById('nm').value,a=document.getElementById('ar2').value;
m+='\nمنطقة التوصيل: '+(val('ar')==='in'?'داخل عُمان':'دول الخليج الأخرى')+'\nالطريقة: '+(val('dm')==='home'?'توصيل للمنزل':'استلام من المكتب')+(val('ar')==='in'?' ('+f(dv())+')':' (التكلفة تحدد عند التواصل)');
if(n)m+='\nالاسم: '+n;if(a)m+='\nموقع التوصيل: '+a;
window.open('https://wa.me/'+NUM+'?text='+encodeURIComponent(m),'_blank')}
show();draw();
</script></body></html>
